<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TRGlobal">
  <rect width="64" height="64" rx="14" fill="#0EA5E9"/>

  <!-- Two thin handles, clearly separated -->
  <path d="M26 24 V21 a6 6 0 0 1 12 0 V24"
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tapered bag body: wider at the top, narrowing toward the base -->
  <path d="M14 24 H50 L46 52 H18 Z" fill="#FFFFFF"/>

  <!-- Fold line across the top lip of the bag -->
  <path d="M15 31 H49" fill="none" stroke="#0EA5E9" stroke-width="2"/>

  <!-- Globe -->
  <circle cx="32" cy="42" r="6.5" fill="none" stroke="#0EA5E9" stroke-width="2"/>
  <path d="M25.5 42 h13 M32 35.5 a9 9 0 0 1 0 13 a9 9 0 0 1 0 -13"
        fill="none" stroke="#0EA5E9" stroke-width="2"/>
</svg>
